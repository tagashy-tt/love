<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1c1016;
    --rose: #e8a0b4;
    --gold: #f4d58d;
    --mist: #b39ea3;
    --cream: #f5ece2;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%; background: var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-family:'Manrope', sans-serif;
  }
  .wrap{ text-align:center; padding: 6vh 6vw; }
  h1{
    font-family:'Playfair Display', serif;
    font-weight:600; font-style:italic;
    font-size: clamp(2.2rem, 8vw, 3.2rem);
    color: var(--cream);
    margin-bottom: 3rem;
    text-shadow: 0 0 40px rgba(232,160,180,0.3);
  }
  .choices{ display:flex; gap: 1.2rem; justify-content:center; flex-wrap:wrap; }
  a.choice{
    text-decoration:none;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--mist);
    background: rgba(179,158,163,0.1);
    border: 1px solid rgba(179,158,163,0.35);
    padding: 0.9rem 2.2rem;
    border-radius: 999px;
    transition: color 0.3s ease, border-color 0.3s ease, background 0.3s ease;
  }
  a.choice:hover{ color: var(--gold); border-color: var(--gold); background: rgba(244,213,141,0.08); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Marina</h1>
    <div class="choices">
      <a class="choice" href="marina_es.html">Español</a>
      <a class="choice" href="marina_ru.html">Русский</a>
    </div>
  </div>
</body>
</html>
